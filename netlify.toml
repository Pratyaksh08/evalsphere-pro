# =============================================================================
# Netlify Deployment Configuration — EvalSphere PRO
# =============================================================================

[build]
  # Directory where static frontend assets are located
  publish = "frontend"

# Proxy API requests to your hosted Render backend
[[redirects]]
  from = "/api/*"
  to = "https://evalsphere-pro.onrender.com/api/:splat"
  status = 200
  force = true

# SPA Fallback & Asset Handling
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
